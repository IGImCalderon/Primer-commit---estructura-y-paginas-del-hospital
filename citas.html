<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Citas - Hospital San Gabriel</title>

    <link rel="stylesheet" href="estilos.css">
</head>

<body>

<header>
    <h1>Hospital San Gabriel</h1>
    <nav>
        <a href="index.html">Inicio</a>
        <a href="mision.html">Misión</a>
        <a href="vision.html">Visión</a>
        <a href="citas.html">Citas</a>
        <a href="recetas.html">Recetas</a>
        <a href="contacto.html">Contacto</a>
    </nav>
</header>

<main>
    <h2>Agenda de Citas Médicas</h2>

    <form id="formCita">

        <label>Nombre del paciente:</label>
        <input type="text" id="nombre" required>

        <label>Especialidad:</label>
        <select id="especialidad">
            <option>Consulta General</option>
            <option>Pediatría</option>
            <option>Medicina Interna</option>
        </select>

        <label>Fecha:</label>
        <input type="date" id="fecha" required>

        <button type="submit">Agendar Cita</button>

    </form>

    <p id="mensaje"></p>

</main>

<footer>
    <p>&copy; 2026 Hospital San Gabriel</p>

    <div>
        <a href="https://validator.w3.org/check?uri=referer">
            <img src="https://www.w3.org/Icons/valid-html5.png" alt="HTML válido">
        </a>

        <a href="https://jigsaw.w3.org/css-validator/check/referer">
            <img src="https://jigsaw.w3.org/css-validator/images/vcss-blue" alt="CSS válido">
        </a>
    </div>
</footer>

<script>
document.getElementById("formCita").addEventListener("submit", async (e) => {
    e.preventDefault();

    const datos = {
        nombre: document.getElementById("nombre").value,
        especialidad: document.getElementById("especialidad").value,
        fecha: document.getElementById("fecha").value
    };

    try {
        const res = await fetch("http://localhost:3000/citas", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(datos)
        });

        const data = await res.json();

        document.getElementById("mensaje").innerText = data.mensaje;

    } catch (error) {
        document.getElementById("mensaje").innerText = "Error al conectar con el servidor";
    }
});
</script>

</body>
</html>
