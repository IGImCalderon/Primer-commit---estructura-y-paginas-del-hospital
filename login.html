<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Login</title>

    <link
    rel="stylesheet"
    href="estilos.css">

</head>

<body>

<header>

    <h1>Iniciar Sesión</h1>

</header>

<main>

    <form id="formLogin">

        <label>Email:</label>

        <input
        type="email"
        id="email"
        required>

        <label>Contraseña:</label>

        <input
        type="password"
        id="password"
        required>

        <button type="submit">

            Entrar

        </button>

    </form>

    <p id="mensaje"></p>

</main>

<script src="js/login.js"></script>

</body>

</html>
